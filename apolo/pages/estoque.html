<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estoque - Sistema Administrativo</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div class="estoque">

        <h1>Controle de Estoque</h1>

        <p>
            Aqui serão cadastrados e controlados os produtos da loja.
        </p>

        <!-- BOTÃO ADICIONAR -->

        <button type="button" id="btnAdicionar">
            Adicionar produto
        </button>


        <!-- FORMULÁRIO DO PRODUTO -->

        <div id="formProduto" style="display: none;">

                   <h2>Produtos cadastrados</h2>

        <p class="resumo-estoque" id="resumoEstoque"></p>

        <!-- BARRA DE BUSCA -->

            <form id="produtoForm">

                <label for="nomeProduto">
                    Nome do produto
                </label>

                <input type="text" id="nomeProduto">

                <br><br>

                <label for="categoriaProduto">
                    Categoria
                </label>

                <input type="text" id="categoriaProduto">

                <br><br>

                <label for="quantidadeProduto">
                    Quantidade
                </label>

                <input type="number" id="quantidadeProduto">

                <br><br>

                <label for="precoProduto">
                    Preço
                </label>

                <input type="number" id="precoProduto" step="0.01">

                <br><br>

                <button type="submit">
                    Cadastrar produto
                </button>

            </form>

        </div>


        <!-- TABELA -->

        <h2>Produtos cadastrados</h2>

        <!-- BARRA DE BUSCA -->

        <div class="barra-busca">

            <svg class="icone-busca" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
                <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>

            <select id="buscaProduto">
                <option value="">Todos os produtos</option>
            </select>

        </div>

        <table>

            <thead>

                <tr>
                    <th>Produto</th>
                    <th>Categoria</th>
                    <th>Quantidade</th>
                    <th>Preço</th>
                    <th>Ação</th>
                </tr>

            </thead>

            <tbody id="tabelaEstoque">

            </tbody>

        </table>


        <br>


        <!-- VOLTAR -->

        <a href="dashboard.html">
            Voltar
        </a>

    </div>


    <!-- JAVASCRIPT -->

    <script src="../js/script.js"></script>

</body>

</html>
