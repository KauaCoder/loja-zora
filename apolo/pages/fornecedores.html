<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fornecedores - Sistema Administrativo</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="estoque">

        <h1>Fornecedores</h1>

        <p>
            Aqui serão cadastrados os fornecedores da loja.
        </p>

        <!-- BOTÃO ADICIONAR -->

        <button type="button" id="btnAdicionarFornecedor">
            Adicionar fornecedor
        </button>


        <!-- FORMULÁRIO DO FORNECEDOR -->

        <div id="formFornecedor" style="display: none;">

            <h2>Novo fornecedor</h2>

            <form id="fornecedorForm">

                <label for="nomeFornecedor">
                    Nome do fornecedor
                </label>

                <input type="text" id="nomeFornecedor">

                <br><br>

                <label for="contatoFornecedor">
                    Contato (pessoa)
                </label>

                <input type="text" id="contatoFornecedor">

                <br><br>

                <label for="telefoneFornecedor">
                    Telefone
                </label>

                <input type="text" id="telefoneFornecedor">

                <br><br>

                <label for="emailFornecedor">
                    Email
                </label>

                <input type="email" id="emailFornecedor">

                <br><br>

                <button type="submit">
                    Cadastrar fornecedor
                </button>

            </form>

        </div>


        <!-- TABELA -->

        <h2>Fornecedores cadastrados</h2>

        <!-- BARRA DE BUSCA -->

        <div class="barra-busca">

            <svg class="icone-busca" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
                <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>

            <select id="buscaFornecedor">
                <option value="">Todos os fornecedores</option>
            </select>

        </div>

        <table>

            <thead>

                <tr>
                    <th>Nome</th>
                    <th>Contato</th>
                    <th>Telefone</th>
                    <th>Email</th>
                    <th>Ação</th>
                </tr>

            </thead>

            <tbody id="tabelaFornecedores">

            </tbody>

        </table>


        <br>


        <!-- VOLTAR -->

        <a href="dashboard.html">
            Voltar
        </a>

    </div>


    <!-- JAVASCRIPT -->

    <script src="../js/script.js"></script>

</body>

</html>
